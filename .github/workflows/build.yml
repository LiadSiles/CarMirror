name: Build APK

# Every push to main builds the app and publishes it as the "latest" release,
# so the newest APK is always at:
# https://github.com/LiadSiles/CarMirror/releases/latest/download/CarMirror.apk
# Other branches and pull requests only build (to catch errors) and attach the APK as an artifact.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04  # has the Android SDK preinstalled
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.10.2"

      - name: Build APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/full/release/app-full-release.apk CarMirror.apk
          cp app/build/outputs/apk/lite/release/app-lite-release.apk CarMirror-Lite.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CarMirror-${{ github.run_number }}
          path: |
            CarMirror.apk
            CarMirror-Lite.apk

      - name: Publish release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          gh release create "$TAG" CarMirror.apk CarMirror-Lite.apk \
            --title "Car Mirror $TAG" \
            --notes "Built from ${{ github.sha }}. CarMirror.apk = with touch control. CarMirror-Lite.apk = no touch control, use it if Play Protect blocks the full one." \
            --latest
